{% extends 'user/layout/base.html' %}

{% block title %}Sign Up - NextGen LMS{% endblock %}

{% block content %}
<style>
  body { background-color: #f9fafb; }
  .auth-container {
    min-height: calc(100vh - 80px);
    display: flex; align-items: center; justify-content: center;
    padding: 3rem 1rem;
  }
  .auth-card {
    background: white;
    width: 100%; max-width: 500px;
    padding: 3rem;
    border-radius: 1.5rem;
    box-shadow: 0 20px 40px rgba(0,0,0,0.05);
    border: 1px solid #e5e7eb;
  }
  .auth-header { text-align: center; margin-bottom: 2rem; }
  .auth-header h1 { font-size: 2rem; font-weight: 800; color: #111827; margin-bottom: 0.5rem; }
  .auth-header p { color: #6b7280; font-size: 1rem; }
  
  .form-row { display: flex; gap: 1rem; }
  .form-row .form-group { flex: 1; }
  
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #374151; font-size: 0.875rem;}
  .form-group input, .form-group select {
    width: 100%; padding: 0.875rem 1rem;
    border: 2px solid #e5e7eb;
    border-radius: 0.75rem; font-size: 1rem;
    box-sizing: border-box; transition: all 0.2s;
    background: white;
  }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
  
  .btn-auth {
    width: 100%; padding: 1rem; background: #4f46e5; color: white;
    border: none; border-radius: 0.75rem; font-size: 1.1rem; font-weight: 700;
    cursor: pointer; transition: all 0.3s; margin-top: 1rem; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
  }
  .btn-auth:hover { background: #4338ca; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(79, 70, 229, 0.3); }
</style>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Create Account</h1>
      <p>Start your learning journey today.</p>
    </div>
    
    <form action="" method="POST">
      {% csrf_token %}
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" name="first_name" placeholder="Rahul" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" name="last_name" placeholder="Sharma" required>
        </div>
      </div>
      
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="you@example.com" required>
      </div>
      
      <div class="form-group">
        <label>Phone Number (for OTP)</label>
        <div style="display: flex; gap: 0.5rem;">
          <input type="text" value="+91" readonly style="width: 60px; background: #f3f4f6; color: #6b7280; text-align: center; padding: 0.875rem 0;">
          <input type="tel" name="phone" placeholder="9876543210" pattern="[0-9]{10}" required style="flex: 1;">
        </div>
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Create a strong password" required>
      </div>

      <div class="form-group">
        <label>I want to join as a:</label>
        <select name="role" required>
          <option value="student">Student (Learn Courses)</option>
          <option value="instructor">Instructor (Teach Courses)</option>
        </select>
      </div>
      
      <button type="submit" class="btn-auth">Sign Up & Verify OTP</button>
    </form>
    
    <p style="text-align: center; margin-top: 2rem; color: #6b7280;">
      Already have an account? <a href="/login" style="color: #4f46e5; font-weight: 700; text-decoration: none;">Log In</a>
    </p>
  </div>
</div>
{% endblock %}
