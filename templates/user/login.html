{% extends 'user/layout/base.html' %}

{% block title %}Log In - NextGen LMS{% endblock %}

{% block content %}
<style>
  body { background-color: #f9fafb; }
  .auth-container {
    min-height: calc(100vh - 80px);
    display: flex; align-items: center; justify-content: center;
    padding: 3rem 1rem;
  }
  .auth-card {
    background: white;
    width: 100%; max-width: 450px;
    padding: 3rem;
    border-radius: 1.5rem;
    box-shadow: 0 20px 40px rgba(0,0,0,0.05);
    border: 1px solid #e5e7eb;
  }
  .auth-header { text-align: center; margin-bottom: 2rem; }
  .auth-header h1 { font-size: 2rem; font-weight: 800; color: #111827; margin-bottom: 0.5rem; }
  .auth-header p { color: #6b7280; font-size: 1rem; }
  
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #374151; font-size: 0.875rem;}
  .form-group input {
    width: 100%; padding: 0.875rem 1rem;
    border: 2px solid #e5e7eb;
    border-radius: 0.75rem; font-size: 1rem;
    box-sizing: border-box; transition: all 0.2s;
  }
  .form-group input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
  
  .btn-auth {
    width: 100%; padding: 1rem; background: #4f46e5; color: white;
    border: none; border-radius: 0.75rem; font-size: 1.1rem; font-weight: 700;
    cursor: pointer; transition: all 0.3s; margin-top: 1rem; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
  }
  .btn-auth:hover { background: #4338ca; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(79, 70, 229, 0.3); }

  .divider { display: flex; align-items: center; text-align: center; margin: 2rem 0; color: #9ca3af; font-size: 0.875rem; }
  .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e5e7eb; }
  .divider:not(:empty)::before { margin-right: .5em; }
  .divider:not(:empty)::after { margin-left: .5em; }
</style>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Welcome Back</h1>
      <p>Log in to access your courses.</p>
    </div>
    
    <form action="" method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.875rem;">
        <label style="display: flex; gap: 0.5rem; align-items: center; cursor: pointer; color: #4b5563;">
          <input type="checkbox" style="width: 16px; height: 16px; accent-color: #4f46e5;"> Remember me
        </label>
        <a href="#" style="color: #4f46e5; font-weight: 600; text-decoration: none;">Forgot Password?</a>
      </div>
      
      <button type="submit" class="btn-auth">Secure Log In</button>
    </form>
    
    <p style="text-align: center; margin-top: 2rem; color: #6b7280;">
      Don't have an account? <a href="/signup" style="color: #4f46e5; font-weight: 700; text-decoration: none;">Sign Up here</a>
    </p>
  </div>
</div>
{% endblock %}
