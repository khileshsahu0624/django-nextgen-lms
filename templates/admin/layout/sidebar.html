<div class="admin-sidebar">
    <div style="padding: 12px 1rem; border-bottom: 1px solid var(--admin-border); text-align: center; height: 70px; display: flex; align-items: center; justify-content: center;">
        <h2 style="color: var(--admin-primary); font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin:0;">
            <i class="fa-solid fa-graduation-cap" style="font-size: 12px;"></i> <span class="sidebar-header-text">LMS Admin</span>
        </h2>
    </div>

    <style>
        .sidebar-menu { list-style: none; padding: 12px 11px; }
        .sidebar-menu li { margin-bottom: 0.1rem; }
        .sidebar-menu a {
            text-decoration: none;
            color: var(--admin-text-light);
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 0.6rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            font-size: 12px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: #eef2ff;
            color: var(--admin-primary);
        }
        .sidebar-menu i { width: 16px; text-align: center; font-size: 13px; transition: all 0.2s ease; }
        .menu-title {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 700;
            color: #9ca3af;
            letter-spacing: 0.05em;
            margin: 1.25rem 0 0.25rem 1rem;
            white-space: nowrap;
        }
        .badge-count {
            background: #ef4444;
            color: white;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 10px;
            margin-left: auto;
            font-weight: 600;
        }
    </style>

    <ul class="sidebar-menu">
        {% for category in sidebar_categories %}
            <div class="menu-title">{{ category.name }}</div>
            {% for module in category.modules.all %}
            <li>
                <a href="{{ module.resolved_url }}" class="{% if request.resolver_match.url_name == module.url_name %}active{% endif %}">
                    <i class="{{ module.icon }}"></i> <span class="menu-text">{{ module.name }}</span>
                </a>
            </li>
            {% endfor %}
        {% endfor %}
    </ul>
</div>
