<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %} | LMS</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <style>
        /* Custom DataTables Styling */
        .dataTables_wrapper .dataTables_length select,
        .dataTables_wrapper .dataTables_filter input {
            border: 1px solid var(--admin-border);
            border-radius: 0.375rem;
            padding: 0.4rem 11px;
            outline: none;
            font-size: var(--font-size-base);
            margin-left: 0.5rem;
        }
        .dataTables_wrapper .dataTables_filter {
            margin-bottom: 1rem;
        }
        .dataTables_wrapper .dataTables_paginate .paginate_button.current,
        .dataTables_wrapper .dataTables_paginate .paginate_button.current:hover {
            background: var(--admin-primary) !important;
            color: white !important;
            border: none;
            border-radius: 0.375rem;
        }
        .dataTables_wrapper .dataTables_info, 
        .dataTables_wrapper .dataTables_paginate {
            margin-top: 12px;
            font-size: var(--font-size-base);
        }
        table.dataTable thead th, table.dataTable thead td {
            border-bottom: 1px solid var(--admin-border) !important;
        }
        table.dataTable.no-footer {
            border-bottom: 1px solid var(--admin-border) !important;
        }
    </style>
    
    <style>
        :root {
            /* Standard Colors */
            --admin-bg: #f3f4f6;
            --admin-surface: #ffffff;
            --admin-primary: #4f46e5;
            --admin-text-main: #1f2937;
            --admin-text-light: #6b7280;
            --admin-border: #e5e7eb;
            --sidebar-width: 260px;
            
            /* Standard Font Sizes (Max 12px per user request) */
            --font-size-xs: 0.625rem;    /* 10px */
            --font-size-sm: 0.6875rem;   /* 11px */
            --font-size-base: 11px;   /* 12px */
            --font-size-lg: 11px;     /* 12px */
            --font-size-xl: 11px;     /* 12px */
            --font-size-2xl: 11px;    /* 12px */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--admin-bg);
            color: var(--admin-text-main);
            font-size: var(--font-size-base);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Container */
        .admin-sidebar {
            width: var(--sidebar-width);
            background-color: var(--admin-surface);
            border-right: 1px solid var(--admin-border);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            transition: width 0.3s ease;
        }

        /* Main Content Wrapper */
        .admin-main-wrapper {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: margin-left 0.3s ease;
        }

        /* Collapsed State */
        body.sidebar-collapsed .admin-sidebar {
            width: 80px;
        }
        body.sidebar-collapsed .admin-main-wrapper {
            margin-left: 80px;
        }
        body.sidebar-collapsed .menu-text, 
        body.sidebar-collapsed .menu-title,
        body.sidebar-collapsed .badge-count,
        body.sidebar-collapsed .sidebar-header-text {
            display: none !important;
        }
        body.sidebar-collapsed .sidebar-menu a {
            justify-content: center;
            padding: 11px 0;
        }
        body.sidebar-collapsed .sidebar-menu i {
            margin: 0;
            font-size: 1.25rem;
        }

        /* Header Container */
        .admin-header {
            height: 70px;
            background-color: var(--admin-surface);
            border-bottom: 1px solid var(--admin-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        /* Main Content Area */
        .admin-content {
            flex: 1;
            padding: 2rem;
        }

        /* Footer Container */
        .admin-footer {
            background-color: var(--admin-surface);
            border-top: 1px solid var(--admin-border);
            padding: 12px 2rem;
            text-align: center;
            color: var(--admin-text-light);
            font-size: 0.875rem;
        }

        /* Premium Utility Classes */
        .card {
            background: var(--admin-surface);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(229, 231, 235, 0.5);
            padding: 2rem;
            margin-bottom: 12px;
            transition: box-shadow 0.3s ease;
        }
        .card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
        }

        /* Buttons Enhancement */
        button, .btn {
            border-radius: 0.5rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        button:active, .btn:active {
            transform: scale(0.98);
        }

        /* Toast Notification System */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }
        .toast {
            min-width: 300px;
            padding: 1rem 12px;
            border-radius: 11px;
            color: white;
            font-weight: 500;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
            opacity: 0;
            transform: translateX(100%) scale(0.95);
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(0) scale(1);
        }
        .toast-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); } 
        .toast-warning { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); } 
        .toast-error { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }   
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Sidebar Include -->
    {% include 'admin/layout/sidebar.html' %}

    <div class="admin-main-wrapper">
        <!-- Header Include -->
        {% include 'admin/layout/header.html' %}

        <!-- Dynamic Content -->
        <main class="admin-content">
            {% block content %}
            {% endblock %}
        </main>

        <!-- Footer Include -->
        {% include 'admin/layout/footer.html' %}
    </div>

    {% block extra_js %}{% endblock %}

    <!-- jQuery & DataTables JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        $(document).ready(function() {
            // Initialize Standard DataTable
            if ($('.datatable').length) {
                var t = $('.datatable').DataTable({
                    "pageLength": 10,
                    "lengthMenu": [5, 10, 25, 50, 100],
                    "language": {
                        "search": "Filter records:",
                    },
                    "order": [], // Do not sort initially (respect server-side sort)
                    "columnDefs": [{
                        "searchable": false,
                        "orderable": false,
                        "targets": 0
                    }]
                });

                // Dynamically generate S.No. on first column
                t.on('order.dt search.dt', function () {
                    let i = 1;
                    t.cells(null, 0, { search: 'applied', order: 'applied' }).every(function (cell) {
                        this.data(i++);
                    });
                }).draw();
            }
        });

        // Global Notification Function
        function showNotification(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            
            let iconClass = 'fa-circle-check';
            if (type === 'warning') iconClass = 'fa-triangle-exclamation';
            if (type === 'error') iconClass = 'fa-circle-xmark';

            toast.innerHTML = `<i class="fa-solid ${iconClass}"></i> <span>${message}</span>`;
            container.appendChild(toast);

            // Animate In
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    toast.classList.add('show');
                });
            });

            // Auto Hide After 3 Seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400); // Remove from DOM after transition
            }, 3000);
        }

        // Render Django Backend Messages Automatically
        document.addEventListener('DOMContentLoaded', () => {
            {% if messages %}
                {% for message in messages %}
                    (function() {
                        let type = 'success';
                        let tag = "{{ message.tags }}";
                        if (tag.includes('error')) type = 'error';
                        else if (tag.includes('warning')) type = 'warning';
                        
                        // Add slight delay if multiple messages
                        setTimeout(() => {
                            showNotification("{{ message|escapejs }}", type);
                        }, {{ forloop.counter0 }} * 300);
                    })();
                {% endfor %}
            {% endif %}
        });
    </script>
</body>
</html>
