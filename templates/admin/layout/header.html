<header class="admin-header">
  <div style="display: flex; align-items: center; gap: 12px">
    <button
      id="sidebarToggle"
      style="
        background: none;
        border: none;
        font-size: 1.25rem;
        color: var(--admin-text-main);
        cursor: pointer;
        padding: 0.5rem;
      "
    >
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="search-bar" style="position: relative; width: 300px">
      <i
        class="fa-solid fa-magnifying-glass"
        style="
          position: absolute;
          left: 1rem;
          top: 50%;
          transform: translateY(-50%);
          color: var(--admin-text-light);
        "
      ></i>
      <input
        type="text"
        placeholder="Search..."
        style="
          width: 100%;
          padding: 0.6rem 1rem 0.6rem 2.5rem;
          border-radius: 2rem;
          border: 1px solid var(--admin-border);
          outline: none;
          background: #f9fafb;
        "
      />
    </div>
  </div>

  <div
    class="header-profile"
    style="display: flex; align-items: center; gap: 12px"
  >
    <div
      class="notifications"
      style="
        position: relative;
        cursor: pointer;
        color: var(--admin-text-light);
      "
    >
      <i class="fa-regular fa-bell" style="font-size: 1.25rem"></i>
      <span
        style="
          position: absolute;
          top: -5px;
          right: -5px;
          background: #ef4444;
          color: white;
          font-size: 0.65rem;
          padding: 2px 5px;
          border-radius: 50%;
          font-weight: bold;
        "
      >
        3
      </span>
    </div>

    <div
      class="user-menu"
      style="
        display: flex;
        align-items: center;
        gap: 11px;
        cursor: pointer;
        border-left: 1px solid var(--admin-border);
        padding-left: 12px;
        position: relative;
      "
      onclick="toggleUserDropdown(event)"
    >
      <div style="text-align: right">
        <div style="font-size: 0.875rem; font-weight: 600">{{ request.user.first_name }}</div>
        <div
          style="
            font-size: 11px;
            color: var(--admin-text-light);
            text-transform: capitalize;
          "
        >
          {{ request.user.role }}
        </div>
      </div>
      {% if request.user.profile_photo %}
        <img src="{{ request.user.profile_photo.url }}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--admin-primary);" />
      {% else %}
        <div
          style="
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--admin-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
          "
        >
          {{ request.user.first_name|slice:":1"|upper }}
        </div>
      {% endif %}

      <!-- Dropdown -->
      <div id="userDropdown" style="display: none; position: absolute; top: 100%; right: 0; margin-top: 0.5rem; background: white; border: 1px solid var(--admin-border); border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 200px; z-index: 50; overflow: hidden;">
        <a href="#" onclick="openProfileModal(event)" style="display: flex; align-items: center; padding: 11px 1rem; color: var(--admin-text-main); text-decoration: none; font-size: 0.875rem; border-bottom: 1px solid var(--admin-border); transition: background 0.2s;" onmouseover="this.style.backgroundColor='#f3f4f6'" onmouseout="this.style.backgroundColor='transparent'">
          <i class="fa-solid fa-user-pen" style="width: 20px; margin-right: 0.5rem;"></i> Update Profile
        </a>
        <a href="{% url 'logout' %}" style="display: flex; align-items: center; padding: 11px 1rem; color: #ef4444; text-decoration: none; font-size: 0.875rem; transition: background 0.2s;" onmouseover="this.style.backgroundColor='#fef2f2'" onmouseout="this.style.backgroundColor='transparent'">
          <i class="fa-solid fa-arrow-right-from-bracket" style="width: 20px; margin-right: 0.5rem;"></i> Logout
        </a>
      </div>
    </div>
  </div>
</header>

<!-- Profile Update Modal -->
<div id="profileUpdateModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
  <div style="background: white; width: 100%; max-width: 450px; border-radius: 1rem; padding: 2rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); position: relative;" onclick="event.stopPropagation()">
    <button onclick="closeProfileModal()" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 12px; cursor: pointer; color: #9ca3af;">&times;</button>
    <h2 style="margin-top: 0; margin-bottom: 12px; font-size: 12px; color: #111827;">Update Profile</h2>
    
    <form action="{% url 'profile' %}" method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div style="margin-bottom: 1rem;">
        <label style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; color: #374151;">First Name</label>
        <input type="text" name="first_name" value="{{ request.user.first_name }}" style="width: 100%; padding: 11px; border: 1px solid #d1d5db; border-radius: 0.5rem; box-sizing: border-box;" required>
      </div>
      <div style="margin-bottom: 1rem;">
        <label style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; color: #374151;">Last Name</label>
        <input type="text" name="last_name" value="{{ request.user.last_name }}" style="width: 100%; padding: 11px; border: 1px solid #d1d5db; border-radius: 0.5rem; box-sizing: border-box;">
      </div>
      <div style="margin-bottom: 1rem;">
        <label style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; color: #374151;">Profile Photo</label>
        <input type="file" name="profile_photo" accept="image/*" style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.5rem; box-sizing: border-box;">
      </div>
      <div style="margin-bottom: 12px;">
        <label style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; color: #374151;">Email (Cannot be changed)</label>
        <input type="email" value="{{ request.user.email }}" disabled style="width: 100%; padding: 11px; border: 1px solid #d1d5db; border-radius: 0.5rem; background: #f3f4f6; color: #6b7280; box-sizing: border-box;">
      </div>
      <button type="submit" style="width: 100%; padding: 11px; background: var(--admin-primary); color: white; border: none; border-radius: 0.5rem; font-weight: 600; font-size: 1rem; cursor: pointer; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">Save Changes</button>
    </form>
  </div>
</div>

<script>
  function toggleUserDropdown(e) {
    e.stopPropagation();
    const dropdown = document.getElementById('userDropdown');
    dropdown.style.display = dropdown.style.display === 'none' || dropdown.style.display === '' ? 'block' : 'none';
  }

  function openProfileModal(e) {
    if(e) e.preventDefault();
    document.getElementById('profileUpdateModal').style.display = 'flex';
    document.getElementById('userDropdown').style.display = 'none';
  }

  function closeProfileModal() {
    document.getElementById('profileUpdateModal').style.display = 'none';
  }

  // Close dropdown and modal when clicking outside
  document.addEventListener('click', function(e) {
    const dropdown = document.getElementById('userDropdown');
    if (dropdown && dropdown.style.display === 'block') {
      dropdown.style.display = 'none';
    }
    
    const modal = document.getElementById('profileUpdateModal');
    if (modal && modal.style.display === 'flex') {
      if (e.target === modal) {
        closeProfileModal();
      }
    }
  });

  document.addEventListener("DOMContentLoaded", function () {
    const toggleBtn = document.getElementById("sidebarToggle");
    toggleBtn.addEventListener("click", function () {
      document.body.classList.toggle("sidebar-collapsed");

      // If chart exists, tell Chart.js to resize after css transition
      setTimeout(() => {
        if (window.revenueChart) {
          window.revenueChart.resize();
        } else {
          // Quick hack to trigger window resize event for chartjs
          window.dispatchEvent(new Event("resize"));
        }
      }, 300);
    });
  });
</script>
