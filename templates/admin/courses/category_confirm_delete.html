{% extends 'admin/layout/base.html' %}

{% block title %}Delete Category{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 4rem auto;">
    <div class="card" style="text-align: center; padding: 2.5rem 2rem; border-radius: 8px; background: #fff; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);">
        <div style="width: 64px; height: 64px; background: #fef2f2; color: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 1.5rem auto;">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        
        <h1 style="font-size: 18px; color: #111827; font-weight: 700; margin: 0 0 0.5rem 0;">Delete Category</h1>
        <p style="color: #475569; font-size: 12px; margin: 0 0 2rem 0; line-height: 1.5;">
            Are you sure you want to delete the category <strong>"{{ object.name }}"</strong>?<br>
            This action cannot be undone.
        </p>

        <form method="POST" style="display: flex; gap: 1rem; justify-content: center;">
            {% csrf_token %}
            <a href="{% url 'category_list' %}" class="btn" style="padding: 0.6rem 1.5rem; background: #f1f5f9; color: #475569; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 12px;">Cancel</a>
            <button type="submit" class="btn" style="padding: 0.6rem 1.5rem; background: #ef4444; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer;">Yes, Delete Category</button>
        </form>
    </div>
</div>
{% endblock %}
