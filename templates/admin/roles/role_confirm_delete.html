{% extends 'admin/layout/base.html' %}

{% block title %}Delete Role{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
    <div class="card" style="padding: 3rem 2rem;">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: #fee2e2; color: #ef4444; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1.5rem auto;">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        
        <h1 style="font-size: 1.5rem; color: #111827; font-weight: 700; margin-bottom: 0.5rem;">Delete Role</h1>
        <p style="color: #4b5563; font-size: 1rem; margin-bottom: 2rem; line-height: 1.5;">
            Are you sure you want to delete the role <strong>"{{ object.name }}"</strong>?<br>
            This action cannot be undone and may affect users assigned to this role.
        </p>

        <form method="POST">
            {% csrf_token %}
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <a href="{% url 'role_list' %}" style="padding: 0.75rem 1.5rem; background: white; border: 1px solid var(--admin-border); color: var(--admin-text-main); border-radius: 0.5rem; text-decoration: none; font-weight: 600; font-size: 0.875rem; transition: background 0.2s;" onmouseover="this.style.background='#f9fafb'" onmouseout="this.style.background='white'">
                    Cancel
                </a>
                <button type="submit" style="padding: 0.75rem 1.5rem; background: #ef4444; color: white; border: none; border-radius: 0.5rem; font-weight: 600; font-size: 0.875rem; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='#dc2626'" onmouseout="this.style.background='#ef4444'">
                    <i class="fa-solid fa-trash" style="margin-right: 0.5rem;"></i> Yes, Delete Role
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
