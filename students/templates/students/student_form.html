{% extends 'students/base.html' %}

{% block title %}
{{ title }}
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-header bg-dark text-white">

                <h4 class="mb-0">
                    {{ title }}
                </h4>

            </div>

            <div class="card-body">

                <form method="POST">

                    {% csrf_token %}

                    {% for field in form %}

                    <div class="mb-3">

                        <label class="form-label">
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% if field.errors %}

                            <div class="text-danger mt-1">

                                {% for error in field.errors %}
                                    {{ error }}
                                {% endfor %}

                            </div>

                        {% endif %}

                    </div>

                    {% endfor %}

                    <button
                        type="submit"
                        class="btn btn-primary">
                        {{ button }}
                    </button>

                    <a
                        href="{% url 'student_list' %}"
                        class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
